<!-- Mini-cart -->
<div class="mini-cart-overlay" data-mini-cart-overlay></div>

<!-- Mini-cart: dropdown under cart icon on desktop, full-height slide panel on mobile -->
<div class="mini-cart" data-mini-cart id="mini-cart">
    <div class="mini-cart__inner">
        <div class="mini-cart__header">
            <div class="mini-cart__title-wrap">
                <h2 class="mini-cart__title">Ваш кошик</h2>
                <svg class="mini-cart__title-underline" aria-hidden="true" viewBox="0 0 122 9" preserveAspectRatio="none">
                    <use href="/assets/icons/sprite.svg#underline-title"></use>
                </svg>
            </div>

            <button class="mini-cart__close" type="button" aria-label="Закрити кошик">
                <svg class="mini-cart__close-icon" aria-hidden="true">
                    <use href="/assets/icons/sprite.svg#close"></use>
                </svg>
            </button>
        </div>

        <div class="mini-cart__meta">
            <span class="mini-cart__count">3 товари</span>

            <button class="mini-cart__clear" type="button">
                <svg class="mini-cart__clear-icon" aria-hidden="true">
                    <use href="/assets/icons/sprite.svg#trash"></use>
                </svg>
                Очистити кошик
            </button>
        </div>

        <ul class="mini-cart__list">
            <li class="cart-item">
                <img class="cart-item__image" src="/assets/img/product-chicken.png" alt=""
                    width="72" height="72" loading="lazy" decoding="async">

                <div class="cart-item__info">
                    <p class="cart-item__name">Онігірі з куркою в японському каррі</p>

                    <div class="cart-item__row">
                        <!-- quantity.js hooks into .quantity / .plus / .minus / input.qty -->
                        <div class="cart-item__counter quantity">
                            <button class="cart-item__counter-btn minus" type="button" aria-label="Зменшити кількість">
                                <svg aria-hidden="true">
                                    <use href="/assets/icons/sprite.svg#icon-minus"></use>
                                </svg>
                            </button>
                            <input type="number" class="cart-item__counter-input qty" value="1" min="1"
                                max="99" step="1" aria-label="Кількість">
                            <button class="cart-item__counter-btn plus" type="button" aria-label="Збільшити кількість">
                                <svg aria-hidden="true">
                                    <use href="/assets/icons/sprite.svg#icon-plus"></use>
                                </svg>
                            </button>
                        </div>

                        <span class="cart-item__price">150₴</span>
                    </div>
                </div>

                <button class="cart-item__remove" type="button" aria-label="Видалити товар">
                    <svg aria-hidden="true">
                        <use href="/assets/icons/sprite.svg#close"></use>
                    </svg>
                </button>
            </li>

            <li class="cart-item">
                <img class="cart-item__image" src="/assets/img/product-chicken.png" alt=""
                    width="72" height="72" loading="lazy" decoding="async">

                <div class="cart-item__info">
                    <p class="cart-item__name">Онігірі з куркою в японському каррі</p>

                    <div class="cart-item__row">
                        <div class="cart-item__counter quantity">
                            <button class="cart-item__counter-btn minus" type="button" aria-label="Зменшити кількість">
                                <svg aria-hidden="true">
                                    <use href="/assets/icons/sprite.svg#icon-minus"></use>
                                </svg>
                            </button>
                            <input type="number" class="cart-item__counter-input qty" value="1" min="1"
                                max="99" step="1" aria-label="Кількість">
                            <button class="cart-item__counter-btn plus" type="button" aria-label="Збільшити кількість">
                                <svg aria-hidden="true">
                                    <use href="/assets/icons/sprite.svg#icon-plus"></use>
                                </svg>
                            </button>
                        </div>

                        <span class="cart-item__price">150₴</span>
                    </div>
                </div>

                <button class="cart-item__remove" type="button" aria-label="Видалити товар">
                    <svg aria-hidden="true">
                        <use href="/assets/icons/sprite.svg#close"></use>
                    </svg>
                </button>
            </li>

            <li class="cart-item">
                <img class="cart-item__image" src="/assets/img/product-chicken.png" alt=""
                    width="72" height="72" loading="lazy" decoding="async">

                <div class="cart-item__info">
                    <p class="cart-item__name">Онігірі з куркою в японському каррі</p>

                    <div class="cart-item__row">
                        <div class="cart-item__counter quantity">
                            <button class="cart-item__counter-btn minus" type="button" aria-label="Зменшити кількість">
                                <svg aria-hidden="true">
                                    <use href="/assets/icons/sprite.svg#icon-minus"></use>
                                </svg>
                            </button>
                            <input type="number" class="cart-item__counter-input qty" value="1" min="1"
                                max="99" step="1" aria-label="Кількість">
                            <button class="cart-item__counter-btn plus" type="button" aria-label="Збільшити кількість">
                                <svg aria-hidden="true">
                                    <use href="/assets/icons/sprite.svg#icon-plus"></use>
                                </svg>
                            </button>
                        </div>

                        <span class="cart-item__price">150₴</span>
                    </div>
                </div>

                <button class="cart-item__remove" type="button" aria-label="Видалити товар">
                    <svg aria-hidden="true">
                        <use href="/assets/icons/sprite.svg#close"></use>
                    </svg>
                </button>
            </li>
        </ul>

        <div class="mini-cart__footer">
            <div class="mini-cart__total">
                <span class="mini-cart__total-label">Разом:</span>
                <span class="mini-cart__total-value">450₴</span>
            </div>

            <button class="mini-cart__checkout button button--primary" type="button">Оформити замовлення</button>

            <a href="/shop.html" class="mini-cart__continue">
                Продовжити покупки
                <svg class="mini-cart__continue-underline" aria-hidden="true" viewBox="0 0 134 5"
                    preserveAspectRatio="none">
                    <use href="/assets/icons/sprite.svg#underline-brush"></use>
                </svg>
            </a>
        </div>
    </div>
</div>
